[project]
name = "repochat"
version = "0.1.0"
description = "Chat with any public GitHub repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # Database: async Postgres driver + pgvector type adapter
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # GitHub API client
    "httpx>=0.27",
    # SQS + S3 (LocalStack in dev, real AWS in prod)
    "boto3>=1.35",
    # Retrieval orchestration
    "langgraph>=0.3",
    # Local embeddings (bge-small) + cross-encoder reranker
    "sentence-transformers>=3.0",
    "torch>=2.4",
    # Code chunking
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    # .gitignore matching
    "pathspec>=0.12",
    # LLM providers: openai SDK covers OpenAI and Groq (OpenAI-compatible); anthropic SDK for Claude
    "openai>=1.50",
    "anthropic>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# No installable package: api/ and worker/ are imported via PYTHONPATH (see pytest config, Makefile, Dockerfile).
[tool.uv]
package = false

# CPU-only torch keeps Docker images and local installs small (no CUDA wheels).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
pythonpath = ["apps", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a running Postgres with pgvector (DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "eval"]
